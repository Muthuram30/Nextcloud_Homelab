# Example compose file placeholder
version: "3.9"

services:
  nextcloud-aio-mastercontainer:
    image: nextcloud/all-in-one:latest
    container_name: nextcloud-aio-mastercontainer
    restart: always

    ports:
      - "8080:8080"

    environment:
      APACHE_PORT: 11000
      APACHE_IP_BINDING: 0.0.0.0
      NEXTCLOUD_DATADIR: /run/desktop/mnt/host/d/CloudServer/Data
      NEXTCLOUD_MOUNT: /run/desktop/mnt/host/n/NextcloudExternal

    volumes:
      - nextcloud_aio_mastercontainer:/mnt/docker-aio-config
      - /run/host-services/docker.proxy.sock:/var/run/docker.sock:ro

volumes:
  nextcloud_aio_mastercontainer: